<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polu's 3D Memory Vault 📸✨</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="slidshow.css">
</head>
<body>

    <!-- Particle Background Canvas -->
    <canvas id="canvasBg"></canvas>

    <!-- Top Navigation Bar -->
    <div class="top-bar">
        <a href="birthday.html" class="back-btn">Skip to Birthday Letter →</a>
        <button class="music-btn" id="musicToggleBtn" onclick="toggleAudio()">
            <span id="musicIcon">🔊</span> <span id="musicText">Pause Audio</span>
        </button>
    </div>

    <!-- Main Title -->
    <div class="gallery-header">
        <h1>Polu's Memory Reel 💖</h1>
        <p id="statusSubtitle">Playing Birthday Quote & Memories... Landing on Birthday Page when complete ✨</p>
    </div>

    <!-- Start Audio Overlay (for Autoplay bypass) -->
    <div id="startOverlay" class="start-overlay" style="display: flex;">
        <div class="overlay-card">
            <h2>Polu's Birthday Surprise 💖</h2>
            <p>Listen to your special birthday quote while experiencing our favorite memories together ✨</p>
            <button class="btn-start-surprise" id="startSurpriseBtn">
                ▶ Start Birthday Memory Reel 🎵
            </button>
        </div>
    </div>

    <!-- 3D Stage Container -->
    <div class="stage3d">
        <div class="ring3d" id="ring3d">
            <!-- 31 Photo Cards will be dynamically structured and rendered -->
        </div>
    </div>

    <!-- Control Bar -->
    <div class="controls-bar">
        <button class="ctrl-btn" id="prevBtn" title="Previous Memory">‹ Prev</button>
        <button class="ctrl-btn" id="autoBtn" title="Toggle Auto-Rotation">⏸ Auto Play</button>
        <button class="ctrl-btn" id="nextBtn" title="Next Memory">Next ›</button>
        <div class="counter-badge">
            Memory <span id="currentNum">01</span> / <span id="totalNum">34</span>
        </div>

    </div>

    <!-- Fullscreen Lightbox Modal -->
    <div class="lightbox" id="lightbox">
        <div class="lightbox-content">
            <button class="lightbox-close" id="lightboxClose">&times;</button>
            <img src="" id="lightboxImg" alt="Enlarged Memory">
            <div class="lightbox-caption" id="lightboxCaption">Memory 01</div>
        </div>
    </div>

    <!-- Dual Audio Elements -->
    <audio id="quoteAudio" src="audio/quate.mp3"></audio>
    <audio id="bgAudio" src="audio/bg.mp3" loop></audio>

    <script src="slidshow.js"></script>
</body>
</html>
