<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown to Polu's Birthday 🎂</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Pacifico&display=swap" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #31103f 100%);
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.15);
            --accent-pink: #ec4899;
            --accent-purple: #a855f7;
            --accent-gold: #fbbf24;
            --text-light: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            font-family: 'Outfit', sans-serif;
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient floating lights */
        .ambient-glow {
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(236,72,153,0.35) 0%, rgba(0,0,0,0) 70%);
            top: 15%;
            left: 15%;
            filter: blur(50px);
            animation: pulseGlow 8s ease-in-out infinite alternate;
            pointer-events: none;
        }

        .ambient-glow-2 {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(168,85,247,0.3) 0%, rgba(0,0,0,0) 70%);
            bottom: 15%;
            right: 15%;
            filter: blur(60px);
            animation: pulseGlow 10s ease-in-out infinite alternate-reverse;
            pointer-events: none;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.7; }
            100% { transform: scale(1.2) translate(30px, -20px); opacity: 1; }
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 45px 35px;
            text-align: center;
            max-width: 650px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            font-size: 2.8rem;
            background: linear-gradient(135deg, #f472b6, #fb7185, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            text-shadow: 0 4px 20px rgba(236,72,153,0.3);
        }

        .subtitle {
            font-size: 1.1rem;
            color: #cbd5e1;
            margin-bottom: 35px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 35px;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 20px 10px;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .time-box:hover {
            transform: translateY(-5px);
            border-color: rgba(236,72,153,0.4);
            background: rgba(255, 255, 255, 0.09);
        }

        .time-val {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: block;
            line-height: 1.1;
        }

        .time-label {
            font-size: 0.85rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 8px;
            font-weight: 600;
        }

        .actions {
            margin-top: 20px;
        }

        .btn-preview {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            color: white;
            padding: 14px 28px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            box-shadow: 0 10px 25px -5px rgba(236,72,153,0.5);
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-preview:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 15px 30px -5px rgba(236,72,153,0.7);
        }

        @media (max-width: 600px) {
            .card {
                padding: 30px 18px;
            }
            .countdown-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            h1 { font-size: clamp(2rem, 6.5vw, 2.5rem); }
            .subtitle { font-size: 0.95rem; margin-bottom: 25px; }
            .time-val { font-size: 2rem; }
            .btn-preview {
                width: 100%;
                justify-content: center;
                font-size: 0.95rem;
                padding: 14px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="ambient-glow"></div>
    <div class="ambient-glow-2"></div>

    <div class="card">
        <h1>Counting Down for Polu! ✨</h1>
        <p class="subtitle">Something super special is unlocking soon for Akanksha 💖</p>
        
        <div class="countdown-grid">
            <div class="time-box">
                <span class="time-val" id="days">00</span>
                <span class="time-label">Days</span>
            </div>
            <div class="time-box">
                <span class="time-val" id="hours">00</span>
                <span class="time-label">Hours</span>
            </div>
            <div class="time-box">
                <span class="time-val" id="minutes">00</span>
                <span class="time-label">Minutes</span>
            </div>
            <div class="time-box">
                <span class="time-val" id="seconds">00</span>
                <span class="time-label">Seconds</span>
            </div>
        </div>

        <div class="actions">
            <button class="btn-preview" onclick="window.location.href='slidshow1.html?auto=true'">
                Start Birthday Surprise 💖🎁
            </button>
        </div>
    </div>

    <script>
        // Set the countdown date to September 3, 2026 00:00:00
        var countDownDate = new Date("Sep 03, 2026 00:00:00").getTime();

        var countdownFunction = setInterval(function() {
            var now = new Date().getTime();
            var distance = countDownDate - now;

            var days = Math.floor(distance / (1000 * 60 * 60 * 24));
            var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            var seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Update DOM with padded zeros
            document.getElementById("days").innerText = String(Math.max(0, days)).padStart(2, '0');
            document.getElementById("hours").innerText = String(Math.max(0, hours)).padStart(2, '0');
            document.getElementById("minutes").innerText = String(Math.max(0, minutes)).padStart(2, '0');
            document.getElementById("seconds").innerText = String(Math.max(0, seconds)).padStart(2, '0');

            // When countdown reaches zero, redirect automatically to slideshow memory video sequence
            if (distance <= 0) {
                clearInterval(countdownFunction);
                window.location.href = "slidshow1.html?auto=true";
            }
        }, 1000);
    </script>

</body>
</html>
